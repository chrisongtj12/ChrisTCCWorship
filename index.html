<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <title>TCC Setlist</title>
    <script>
      // Apply saved theme before React mounts to avoid a flash of the wrong theme.
      (function () {
        try {
          var t = localStorage.getItem("tcc.theme");
          if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          var el = document.documentElement;
          if (t === "dark" || t === "stage") el.classList.add("dark");
          if (t === "stage") el.classList.add("stage");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
